name: ar_object_scanner
description: AI-powered AR application that scans real-world objects and generates intelligent interactive digital twins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.10.5
  image_picker: ^1.0.4

  # 3D Rendering
  model_viewer_plus: ^1.7.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.1

  # Networking
  dio: ^5.4.0

  # UI Components
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  lottie: ^3.0.0
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  percent_indicator: ^4.2.3

  # Voice & Speech
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.5

  # Storage & Database
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.2.2

  # Real-time Communication
  socket_io_client: ^2.0.3+1

  # Media & Files
  path_provider: ^2.1.2
  file_picker: ^6.1.1
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

  # Sensors & Device
  sensors_plus: ^4.0.2
  vibration: ^1.8.4

  # Location
  geolocator: ^11.0.0

  # Utils
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  device_info_plus: ^10.1.0
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  image: ^4.1.3
  vector_math: ^2.1.4
  collection: ^1.18.0
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models_3d/
    - assets/sounds/
    - assets/animations/
    - assets/lottie/
