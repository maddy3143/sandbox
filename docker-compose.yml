version: "3.9"

services:

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model_cache:/app/models
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ar_scanner
      MONGODB_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ar_net

  # ── Celery Worker (AI tasks) ───────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      target: development
    command: celery -A services.tasks worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - model_cache:/app/models
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
      - api
    networks:
      - ar_net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ar_scanner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ar_net

  # ── MongoDB (object data & twin metadata) ─────────────────────────────────
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ar_net

  # ── Redis (cache + Celery broker) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - ar_net

  # ── NeRF GPU Service ───────────────────────────────────────────────────────
  nerf_service:
    image: ar-scanner/nerf-service:latest
    build:
      context: ./ai_modules/reconstruction_3d
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8001:8001"
    volumes:
      - reconstruction_cache:/app/output
    networks:
      - ar_net
    profiles:
      - gpu     # Only starts with: docker compose --profile gpu up

  # ── Prometheus monitoring ─────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ar_net
    profiles:
      - monitoring

  # ── Grafana dashboard ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ar_net
    profiles:
      - monitoring

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  model_cache:
  reconstruction_cache:
  grafana_data:

networks:
  ar_net:
    driver: bridge
