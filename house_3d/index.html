<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Indian Residence – 3D Model 2026</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#87CEEB;touch-action:none;}
  canvas{display:block;}
  #ui{position:fixed;top:10px;left:10px;z-index:10;width:200px;}
  #panel{background:rgba(10,12,28,.92);backdrop-filter:blur(14px);color:#fff;border-radius:12px;border:1px solid rgba(255,255,255,.15);overflow:hidden;}
  #panel-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 8px;cursor:pointer;user-select:none;}
  #panel-head h2{font-size:13px;font-weight:700;color:#FFD700;letter-spacing:.8px;margin:0;}
  #panel-head p{font-size:9px;color:#aaa;margin:1px 0 0;}
  #toggle-arrow{font-size:16px;color:#FFD700;transition:transform .25s;line-height:1;}
  #panel-body{padding:0 13px 12px;transition:max-height .35s ease,opacity .3s ease;max-height:700px;opacity:1;overflow:hidden;}
  #panel-body.collapsed{max-height:0;opacity:0;padding-bottom:0;}
  .sec{font-size:9px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px;}
  .btn{display:block;width:100%;margin:3px 0;padding:8px 10px;background:rgba(255,255,255,.08);color:#ddd;border:1px solid rgba(255,255,255,.18);border-radius:7px;cursor:pointer;font-size:11px;text-align:left;transition:.18s;}
  .btn:hover,.btn:active{background:rgba(255,215,0,.2);border-color:#FFD700;color:#FFD700;}
  .btn.on{background:rgba(255,215,0,.22);border-color:#FFD700;color:#FFD700;}
  #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:rgba(255,255,255,.8);padding:6px 16px;border-radius:20px;font-size:11px;pointer-events:none;white-space:nowrap;}
  @media(max-width:480px){
    #ui{width:calc(100vw - 20px);top:8px;left:8px;}
    .btn{padding:10px 12px;font-size:12px;margin:4px 0;}
    #hint{font-size:10px;padding:5px 12px;bottom:10px;}
  }
</style>
</head>
<body>

<div id="ui">
  <div id="panel">
    <div id="panel-head" onclick="togglePanel()">
      <div><h2>HOUSE 3D</h2><p>15'6" × 44' · 2-Floor Residence</p></div>
      <span id="toggle-arrow">▲</span>
    </div>
    <div id="panel-body" id="panel-body">
      <div class="sec">Views</div>
      <button class="btn" onclick="gotoView('ext')">🏠 Exterior</button>
      <button class="btn" onclick="gotoView('elev')">📐 Front Elevation</button>
      <button class="btn" onclick="gotoView('gf')">🛋 Ground Floor</button>
      <button class="btn" onclick="gotoView('ff')">🛏 First Floor</button>
      <button class="btn" onclick="gotoView('cut')">✂ Section Cut</button>
      <button class="btn" onclick="gotoView('top')">🗺 Top View</button>
      <div class="sec">Floors</div>
      <button class="btn on" id="btn-gf" onclick="toggleGroup('gf')">Ground Floor</button>
      <button class="btn on" id="btn-ff" onclick="toggleGroup('ff')">First Floor</button>
      <button class="btn on" id="btn-ext" onclick="toggleGroup('ext')">Exterior / Site</button>
      <div class="sec">Options</div>
      <button class="btn on" id="btn-furn" onclick="toggleFurn()">Furniture</button>
      <button class="btn on" id="btn-lights" onclick="toggleLights()">Interior Lights</button>
      <button class="btn" id="btn-night" onclick="toggleNight()">Day / Night</button>
      <button class="btn" onclick="resetCamera()">↺ Reset Camera</button>
    </div>
  </div>
</div>
<div id="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   MODERN INDIAN RESIDENCE – Three.js r128
   15'6" wide × 44' long  |  2-Floor
   1 unit = 1 foot
   ============================================================ */

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x87CEEB, 120, 300);

const W = window.innerWidth, H = window.innerHeight;
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 600);
camera.position.set(38, 26, 50);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(7.75,8,22);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3; controls.maxDistance = 200;
controls.update();

/* ────── CANVAS TEXTURE HELPERS ────── */
function makeCanvasTex(w, h, fn) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  fn(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function galaxyGraniteTex() {
  return makeCanvasTex(512,512,(ctx,w,h)=>{
    ctx.fillStyle='#0f0f1e'; ctx.fillRect(0,0,w,h);
    // subtle blue veins
    for(let i=0;i<6;i++){
      ctx.beginPath();
      ctx.moveTo(Math.random()*w, Math.random()*h);
      ctx.bezierCurveTo(Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h,Math.random()*w,Math.random()*h);
      ctx.strokeStyle=`rgba(80,100,160,${0.06+Math.random()*0.08})`;
      ctx.lineWidth=1.5+Math.random()*2;
      ctx.stroke();
    }
    // speckles
    for(let i=0;i<2200;i++){
      const x=Math.random()*w, y=Math.random()*h, r=Math.random()*1.2+0.2;
      const g=200+Math.floor(Math.random()*55);
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${g},${g},${g+20},${0.5+Math.random()*0.5})`; ctx.fill();
    }
    // gold flakes
    for(let i=0;i<120;i++){
      const x=Math.random()*w, y=Math.random()*h;
      ctx.beginPath(); ctx.arc(x,y,0.8,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,180,80,${0.4+Math.random()*0.4})`; ctx.fill();
    }
  });
}

function lightGraniteTex() {
  return makeCanvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle='#d0cec8'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<600;i++){
      const x=Math.random()*w, y=Math.random()*h;
      const g=160+Math.floor(Math.random()*40);
      ctx.beginPath(); ctx.arc(x,y,0.8+Math.random()*1.2,0,Math.PI*2);
      ctx.fillStyle=`rgba(${g},${g-10},${g-15},0.4)`; ctx.fill();
    }
  });
}

function teakWoodTex() {
  return makeCanvasTex(256,512,(ctx,w,h)=>{
    ctx.fillStyle='#7a3a10'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<h;i+=3){
      const v=Math.random()*6-3;
      ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(w,i+v);
      ctx.strokeStyle=`rgba(${50+Math.floor(Math.random()*30)},${20+Math.floor(Math.random()*20)},0,0.18)`;
      ctx.lineWidth=1; ctx.stroke();
    }
  });
}

function whiteTileTex() {
  return makeCanvasTex(320,320,(ctx,w,h)=>{
    ctx.fillStyle='#fafafa'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#d0d0d0'; ctx.lineWidth=1;
    for(let x=0;x<=w;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for(let y=0;y<=h;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  });
}

function mosaicTileTex() {
  return makeCanvasTex(240,240,(ctx,w,h)=>{
    ctx.fillStyle='#252525'; ctx.fillRect(0,0,w,h);
    for(let x=0;x<w;x+=20){
      for(let y=0;y<h;y+=20){
        const g=45+Math.floor(Math.random()*25);
        ctx.fillStyle=`rgb(${g},${g},${g})`;
        ctx.fillRect(x+1,y+1,18,18);
      }
    }
  });
}

function wallPlasterTex() {
  return makeCanvasTex(256,256,(ctx,w,h)=>{
    ctx.fillStyle='#f2ede0'; ctx.fillRect(0,0,w,h);
    for(let i=0;i<300;i++){
      const x=Math.random()*w, y=Math.random()*h;
      ctx.fillStyle=`rgba(180,160,130,${Math.random()*0.06})`;
      ctx.fillRect(x,y,Math.random()*3,Math.random()*3);
    }
  });
}

function metroTileTex() {
  return makeCanvasTex(320,160,(ctx,w,h)=>{
    ctx.fillStyle='#f8f8f8'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#bbb'; ctx.lineWidth=1;
    for(let row=0;row*40<h;row++){
      const off=(row%2===0)?0:40;
      for(let col=-1;col*80<w;col++){
        ctx.strokeRect(col*80+off+1, row*40+1, 78, 38);
      }
    }
  });
}

/* ────── MATERIALS ────── */
function mat(color, opts={}) {
  return new THREE.MeshStandardMaterial({color, ...opts});
}
function tmat(tex, opts={}) {
  return new THREE.MeshStandardMaterial({map:tex, ...opts});
}

const ggTex = galaxyGraniteTex();
const ggTex2 = galaxyGraniteTex();
const lgTex = lightGraniteTex();
const twTex = teakWoodTex();
const wtTex = whiteTileTex();
const msTex = mosaicTileTex();
const wpTex = wallPlasterTex();
const mtTex = metroTileTex();

[ggTex,ggTex2].forEach(t=>{t.repeat.set(3,3);});
lgTex.repeat.set(2,2);
twTex.repeat.set(2,4);
wtTex.repeat.set(4,4);
msTex.repeat.set(4,4);
wpTex.repeat.set(6,6);
mtTex.repeat.set(4,2);

const M = {
  ggFloor:  tmat(ggTex,  {roughness:0.15, metalness:0.3}),
  ggTrim:   tmat(ggTex2, {roughness:0.2, metalness:0.25}),
  ggCounter:tmat(ggTex,  {roughness:0.2, metalness:0.2}),
  ltCounter:tmat(lgTex,  {roughness:0.3, metalness:0.05}),
  wood:     tmat(twTex,  {roughness:0.7}),
  dkWood:   mat(0x4a2008,{roughness:0.75}),
  whiteTile:tmat(wtTex,  {roughness:0.25, metalness:0.05}),
  mosaicTile:tmat(msTex, {roughness:0.4}),
  metroTile:tmat(mtTex,  {roughness:0.3, metalness:0.05}),
  extWall:  tmat(wpTex,  {color:0xfff0d8, roughness:0.85}),
  intWall:  mat(0xfaf4eb,{roughness:0.9}),
  accentTeal: mat(0x1a4a5a,{roughness:0.88}),
  accentGrey: mat(0x5a5a6a,{roughness:0.88}),
  accentGreen:mat(0x1a3a2a,{roughness:0.88}),
  accentTerra:mat(0x8a4a35,{roughness:0.88}),
  glass:    mat(0xaaccee,{transparent:true,opacity:0.28,roughness:0.05,metalness:0.1}),
  frostGlass:mat(0xccddee,{transparent:true,opacity:0.45,roughness:0.25}),
  winFrame: mat(0x8a9aaa,{roughness:0.3,metalness:0.7}),
  metal:    mat(0xcccccc,{roughness:0.2,metalness:0.9}),
  gold:     mat(0xd4af37,{roughness:0.3,metalness:0.8}),
  white:    mat(0xffffff,{roughness:0.8}),
  offWhite: mat(0xf5f0e8,{roughness:0.85}),
  blue:     mat(0x2255aa,{roughness:0.8}),
  dkGrey:   mat(0x2a2a3a,{roughness:0.82}),
  mustard:  mat(0xd4930a,{roughness:0.85}),
  terracotta:mat(0xcc6644,{roughness:0.85}),
  burgundy: mat(0x6a1a2a,{roughness:0.82}),
  slab:     mat(0xb0b0b0,{roughness:0.9}),
  ceil:     mat(0xf5f5f0,{roughness:0.95}),
  grass:    mat(0x3a7a35,{roughness:1.0}),
  path:     tmat(ggTex2, {roughness:0.6, metalness:0.1, color:0xaaaaaa}),
  pillar:   mat(0xfff0d8,{roughness:0.8}),
  cpndWall: mat(0xe8dfd0,{roughness:0.9}),
  amber:    mat(0xffcc44,{emissive:0xffcc44,emissiveIntensity:0.6,roughness:0.8}),
  ledStrip: mat(0xffeedd,{emissive:0xffeedd,emissiveIntensity:0.8,roughness:1}),
  skyDay:   mat(0x87CEEB,{side:THREE.BackSide}),
  skyNight: mat(0x05050f,{side:THREE.BackSide}),
  chrome:   mat(0xdddddd,{roughness:0.05,metalness:1.0}),
  teal:     mat(0x1a4a5a,{roughness:0.8}),
};

/* ────── SCENE GROUPS ────── */
const gfG   = new THREE.Group(); scene.add(gfG);
const ffG   = new THREE.Group(); scene.add(ffG);
const furnG = new THREE.Group(); scene.add(furnG);
const extG  = new THREE.Group(); scene.add(extG);

/* ────── GEOMETRY HELPERS ────── */
function box(w,h,d,m,x,y,z,grp,rx=0,ry=0,rz=0){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=true; mesh.receiveShadow=true;
  if(grp) grp.add(mesh); else scene.add(mesh);
  return mesh;
}
function cyl(rt,rb,h,m,x,y,z,grp,seg=16){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);
  mesh.position.set(x,y,z);
  mesh.castShadow=true; mesh.receiveShadow=true;
  if(grp) grp.add(mesh); else scene.add(mesh);
  return mesh;
}
function sph(r,m,x,y,z,grp){
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  if(grp) grp.add(mesh); else scene.add(mesh);
  return mesh;
}

/* ────── DIMENSIONS ────── */
const totalW=15.5, totalL=44, wallT=0.75, innerW=13.75;
const gfH=10.75, ffH=7.83, slabT=0.5, parH=1.5;
const gfTop=gfH, ffTop=gfH+slabT+ffH;
const riserH=0.583, treadD=0.75;
const hallZ=14, hallEndZ=30;
const toiletX=10.75, bathW=totalW-toiletX-wallT;

/* ════════════════════════════════════════════════
   GROUND FLOOR SHELL
   ════════════════════════════════════════════════ */
function buildGFShell() {
  const g=gfG;
  // FLOOR – galaxy granite
  const floorTex=galaxyGraniteTex(); floorTex.repeat.set(6,10);
  box(totalW,0.1,totalL, M.ggFloor, totalW/2,0,totalL/2, g);

  // WALLS exterior face cream plaster
  // Front wall (z=0)
  box(totalW,gfH,wallT, M.extWall, totalW/2,gfH/2,wallT/2, g);
  // Back wall (z=44)
  box(totalW,gfH,wallT, M.extWall, totalW/2,gfH/2,totalL-wallT/2, g);
  // Left wall
  box(wallT,gfH,totalL, M.extWall, wallT/2,gfH/2,totalL/2, g);
  // Right wall
  box(wallT,gfH,totalL, M.extWall, totalW-wallT/2,gfH/2,totalL/2, g);

  // INTERIOR partition walls – interior face
  // Hall/kitchen partition (z=14)
  box(totalW,gfH,wallT, M.intWall, totalW/2,gfH/2,hallZ+wallT/2, g);
  // Hall/bedroom partition (z=30)
  box(totalW,gfH,wallT, M.intWall, totalW/2,gfH/2,hallEndZ+wallT/2, g);
  // Bathroom partition (x=10.75, z=30..44)
  box(wallT,gfH,totalL-hallEndZ, M.intWall, toiletX+wallT/2,gfH/2,hallEndZ+(totalL-hallEndZ)/2, g);

  // Stair partition wall (x=3.75, z=0..14)
  box(wallT,gfH,hallZ, M.intWall, 3.75+wallT/2,gfH/2,hallZ/2, g);

  // BASE granite band 1ft
  box(totalW,1,wallT+0.05, M.ggTrim, totalW/2,0.5,0, g);
  box(totalW,1,wallT+0.05, M.ggTrim, totalW/2,0.5,totalL, g);
  box(wallT+0.05,1,totalL, M.ggTrim, 0,0.5,totalL/2, g);
  box(wallT+0.05,1,totalL, M.ggTrim, totalW,0.5,totalL/2, g);

  // GF CORNICE at gfH – galaxy granite band
  box(totalW+0.1,0.3,wallT+0.06, M.ggTrim, totalW/2,gfH-0.15,0, g);
  box(totalW+0.1,0.3,wallT+0.06, M.ggTrim, totalW/2,gfH-0.15,totalL, g);
  box(wallT+0.06,0.3,totalL+0.1, M.ggTrim, 0,gfH-0.15,totalL/2, g);
  box(wallT+0.06,0.3,totalL+0.1, M.ggTrim, totalW,gfH-0.15,totalL/2, g);

  // CEILING
  box(totalW,slabT,totalL, M.slab, totalW/2,gfH+slabT/2,totalL/2, g);

  // INTERIOR WALLS (inside faces visible cream)
  // Ceiling plaster
  box(innerW,0.05,totalL-wallT*2, M.ceil, totalW/2,gfH-0.01,(totalL)/2, g);
}

/* ════════════════════════════════════════════════
   FIRST FLOOR SHELL
   ════════════════════════════════════════════════ */
function buildFFShell() {
  const g=ffG;
  const ffBase=gfH+slabT;
  // Exterior walls
  box(totalW,ffH,wallT, M.extWall, totalW/2,ffBase+ffH/2,wallT/2, g);
  box(totalW,ffH,wallT, M.extWall, totalW/2,ffBase+ffH/2,totalL-wallT/2, g);
  box(wallT,ffH,totalL, M.extWall, wallT/2,ffBase+ffH/2,totalL/2, g);
  box(wallT,ffH,totalL, M.extWall, totalW-wallT/2,ffBase+ffH/2,totalL/2, g);
  // Interior partitions
  box(totalW,ffH,wallT, M.intWall, totalW/2,ffBase+ffH/2,hallZ+wallT/2, g);
  box(totalW,ffH,wallT, M.intWall, totalW/2,ffBase+ffH/2,hallEndZ+wallT/2, g);
  box(wallT,ffH,totalL-hallEndZ, M.intWall, toiletX+wallT/2,ffBase+ffH/2,hallEndZ+(totalL-hallEndZ)/2, g);

  // FF base granite band
  box(totalW,0.6,wallT+0.05, M.ggTrim, totalW/2,ffBase+0.3,0, g);
  box(totalW,0.6,wallT+0.05, M.ggTrim, totalW/2,ffBase+0.3,totalL, g);
  box(wallT+0.05,0.6,totalL, M.ggTrim, 0,ffBase+0.3,totalL/2, g);
  box(wallT+0.05,0.6,totalL, M.ggTrim, totalW,ffBase+0.3,totalL/2, g);

  // FF cornice
  box(totalW+0.1,0.3,wallT+0.06, M.ggTrim, totalW/2,ffTop-0.15,0, g);
  box(totalW+0.1,0.3,wallT+0.06, M.ggTrim, totalW/2,ffTop-0.15,totalL, g);
  box(wallT+0.06,0.3,totalL+0.1, M.ggTrim, 0,ffTop-0.15,totalL/2, g);
  box(wallT+0.06,0.3,totalL+0.1, M.ggTrim, totalW,ffTop-0.15,totalL/2, g);

  // Flat roof slab
  box(totalW+0.1,slabT,totalL+0.1, M.slab, totalW/2,ffTop+slabT/2,totalL/2, g);
  // Parapet
  box(totalW+0.1,parH,wallT, M.extWall, totalW/2,ffTop+slabT+parH/2,0, g);
  box(totalW+0.1,parH,wallT, M.extWall, totalW/2,ffTop+slabT+parH/2,totalL, g);
  box(wallT,parH,totalL+0.1, M.extWall, 0,ffTop+slabT+parH/2,totalL/2, g);
  box(wallT,parH,totalL+0.1, M.extWall, totalW,ffTop+slabT+parH/2,totalL/2, g);

  // Water tank (behind parapet, top right)
  box(5,3,4, M.slab, totalW-3,ffTop+slabT+parH+1.5,totalL-2.5, g);
  box(5.1,0.15,4.1, M.ggTrim, totalW-3,ffTop+slabT+parH+3.1,totalL-2.5, g); // lid

  // FF floor galaxy granite
  const ffFloorTex=galaxyGraniteTex(); ffFloorTex.repeat.set(6,10);
  box(totalW,0.05,totalL, M.ggFloor, totalW/2,ffBase+0.03,totalL/2, g);
  box(totalW,0.05,totalL, M.ceil, totalW/2,ffTop-0.03,totalL/2, g);
}

/* ════════════════════════════════════════════════
   CORNER PILLARS
   ════════════════════════════════════════════════ */
function buildPillars() {
  const positions=[[0,0],[totalW,0],[0,totalL],[totalW,totalL]];
  positions.forEach(([px,pz])=>{
    cyl(0.5,0.5,gfH,M.pillar, px,gfH/2,pz, gfG);
    // granite cap
    cyl(0.6,0.6,0.3,M.ggTrim, px,gfH,pz, gfG);
    cyl(0.5,0.5,ffH,M.pillar, px,gfH+slabT+ffH/2,pz, ffG);
    cyl(0.6,0.6,0.3,M.ggTrim, px,ffTop,pz, ffG);
  });
}

/* ════════════════════════════════════════════════
   WINDOWS & DOORS
   ════════════════════════════════════════════════ */
function buildOpenings() {
  // GF FRONT (z=0) – 2 large windows + main door
  // Main door (centre)
  box(4,8,0.12, M.dkWood, totalW/2,4,0.38, gfG); // door slab
  box(4.3,8.5,0.08, M.ggTrim, totalW/2,4,0.3, gfG); // granite frame
  box(1.8,2,0.13, M.glass, totalW/2-0.9,7,0.38, gfG); // glass insert L
  box(1.8,2,0.13, M.glass, totalW/2+0.9,7,0.38, gfG); // glass insert R
  // Door handle

/* ════════════════════════════════════════════════

   ════════════════════════════════════════════════ */
function buildStairs() {
  const stairW=3.0;
  const numSteps=19;
  // GF flight: 10 steps from z=2 going up
  for(let i=0;i<10;i++){
    // tread
    box(stairW,0.1,treadD, M.ggFloor, 1.875,i*riserH+riserH+0.05, 2+i*treadD, gfG);
    // white riser
    box(stairW,riserH,0.06, M.white, 1.875,i*riserH+riserH/2, 2+i*treadD, gfG);
  }
  // Landing at y=10*riserH
  const landY=10*riserH;
  box(stairW,0.1,2.5, M.ggFloor, 1.875,landY+0.05, 2+10*treadD+1.25, gfG);
  // FF flight: 9 steps going up from landing
  for(let i=0;i<9;i++){
    box(stairW,0.1,treadD, M.ggFloor, 1.875,landY+0.1+(i+1)*riserH, 2+10*treadD+2.5-i*treadD, gfG);
    box(stairW,riserH,0.06, M.white, 1.875,landY+0.1+(i+1)*riserH-riserH/2, 2+10*treadD+2.5-i*treadD, gfG);
  }
  // Glass + chrome railing (GF flight)
  box(0.06,landY,0.06, M.chrome, 0.45,landY/2,2, gfG); // left post
  box(0.06,landY,0.06, M.chrome, 3.3,landY/2,2, gfG);  // right post

  box(stairW+0.05,0.06,0.06, M.chrome, 1.875,landY,2, gfG); // handrail
}

  box(innerW,ffH,0.05, M.accentGreen, totalW/2,ffB+ffH/2,hallZ+wallT+0.025, ffG);
  // 2-seater sofa
  box(5,1.8,2, M.burgundy, totalW/2,ffB+0.9,hallZ+wallT+8, g);
  box(5,0.7,0.5, M.burgundy, totalW/2,ffB+2.2,hallZ+wallT+7.1, g);
  // Armchair
  box(2.2,1.8,2, M.burgundy, wallT+2,ffB+0.9,hallZ+wallT+10, g);
  box(2.2,0.7,0.5, M.burgundy, wallT+2,ffB+2.2,hallZ+wallT+9.1, g);
  // Study desk
  box(3,0.15,1.5, M.wood, totalW-wallT-2.5,ffB+2.5,hallEndZ-2, g);
  box(3,2.5,0.05, M.wood, totalW-wallT-2.5,ffB+1.25,hallEndZ-1.3, g); // back panel
  // Desk chair
  cyl(0.4,0.4,0.15,M.dkGrey, totalW-wallT-2.5,ffB+2.5,hallEndZ-3.2, g, 12);
  cyl(0.04,0.04,1.8,M.chrome, totalW-wallT-2.5,ffB+1.6,hallEndZ-3.2, g, 8);
  // Bookshelf
  box(0.4,gfH*0.9,4, M.wood, wallT+0.2,ffB+gfH*0.45,hallEndZ-3, g);
  for(let i=0;i<5;i++){
    box(0.35,0.12,3.8, M.dkWood, wallT+0.2,ffB+1+i*1.4,hallEndZ-3, g);
  }
  // Book spines
  [[0.4,0x5577aa],[0.6,0xaa4433],[0.5,0x448833],[0.7,0xaa8822]].forEach(([bw,col],i)=>{
    box(bw,1.1,0.3, mat(col), wallT+0.2, ffB+1.6+i*1.4, hallEndZ-3+i*0.3, g);
  });

  // FF BEDROOM
  box(toiletX-wallT,ffH,0.05, M.accentTerra, (wallT+toiletX)/2,ffB+ffH/2,hallEndZ+wallT+0.025, ffG);
  // Platform bed (lower, teak)
  box(5,0.5,(totalL-hallEndZ)*0.55, M.wood, (wallT+toiletX)/2,ffB+0.25,hallEndZ+wallT+4, g);
  box(5.1,1.2,0.6, M.wood, (wallT+toiletX)/2,ffB+0.85,hallEndZ+wallT+1.7, g); // headboard
  box(5,0.4,4, M.offWhite, (wallT+toiletX)/2,ffB+0.75,hallEndZ+wallT+4, g); // mattress
  box(5,0.15,1.5, M.blue, (wallT+toiletX)/2,ffB+0.97,hallEndZ+wallT+5, g); // blanket
  // FF Wardrobe
  box(0.6,ffH,5, M.wood, toiletX-wallT-0.3,ffB+ffH/2,hallEndZ+wallT+5, g);
  // Study desk (FF bedroom)
  box(3,0.12,1.5, M.dkWood, wallT+2,ffB+2.5,totalL-wallT-2, g);
  box(3,2.5,0.05, M.dkWood, wallT+2,ffB+1.25,totalL-wallT-1.3, g);

  // FF Bathroom (same layout as GF, same zone)
  const ffbx1=toiletX+wallT, ffbx2=totalW-wallT;
  const ffbz1=hallEndZ+wallT, ffbz2=totalL-wallT;
  const ffcx=(ffbx1+ffbx2)/2, ffcz=(ffbz1+ffbz2)/2;
  const ffbW=ffbx2-ffbx1, ffbL=ffbz2-ffbz1;
  box(ffbW,ffH,0.05, M.whiteTile, ffcx,ffB+ffH/2,ffbz1+0.03, ffG);
  box(ffbW,ffH,0.05, M.whiteTile, ffcx,ffB+ffH/2,ffbz2-0.03, ffG);
  box(0.05,ffH,ffbL, M.whiteTile, ffbx1+0.03,ffB+ffH/2,ffcz, ffG);
  box(ffbW,0.05,ffbL, M.mosaicTile, ffcx,ffB+0.03,ffcz, ffG);
  // Vanity
  box(2.2,2,0.8, mat(0x606060,{roughness:0.6}), ffcx,ffB+1,ffbz1+0.7, g);
  box(2.2,0.1,0.8, M.ltCounter, ffcx,ffB+2.06,ffbz1+0.7, g);
  box(0.04,0.4,0.04, M.chrome, ffcx,ffB+2.4,ffbz1+0.5, g);
  // Shower
  box(0.05,ffH*0.85,2, M.frostGlass, ffbx2-0.1,ffB+ffH*0.425,ffbz1+2.3, g);
  box(2.5,0.05,2, M.ggFloor, ffbx2-1.25,ffB+0.03,ffbz1+2.3, g);
  box(0.6,0.06,0.6, M.chrome, ffbx2-1.5,ffB+ffH*0.8,ffbz1+2.3, g);
}

/* ════════════════════════════════════════════════
   EXTERIOR / SITE
   ════════════════════════════════════════════════ */
function buildExterior() {
  const g=extG;
  // Ground plane (grass)
  box(80,0.1,120, M.grass, 40,-0.05,40, g);

  // Compound wall (front)
  box(30,2.5,0.6, M.cpndWall, 15,-0.5+1.25,-8, g);
  // Granite pillars at compound gate
  box(1.2,3,1.2, M.ggTrim, 8,1.5,-8, g);
  box(1.2,3,1.2, M.ggTrim, 22,1.5,-8, g);
  // Gate (horizontal steel bars)
  for(let y=0;y<3;y++){
    box(12,0.12,0.1, M.chrome, 15,0.5+y*0.8,-8, g);
  }
  box(0.15,3.5,0.15, M.chrome, 9.5,1.75,-8, g);
  box(0.15,3.5,0.15, M.chrome, 20.5,1.75,-8, g);

  // Compound side walls
  box(0.6,2.5,20, M.cpndWall, -0.3,1.25,-8+10, g);
  box(0.6,2.5,20, M.cpndWall, 30.3,1.25,-8+10, g);
  // Granite coping top
  box(30,0.2,0.7, M.ggTrim, 15,2.5,-8, g);
  box(0.7,0.2,20, M.ggTrim, -0.35,2.5,-8+10, g);
  box(0.7,0.2,20, M.ggTrim, 30.35,2.5,-8+10, g);

  // Pathway (granite slabs with grass joints)
  for(let i=0;i<6;i++){
    box(2.5,0.12,2, M.path, totalW/2,-0.02,-2-i*3, g);
    box(2.5,0.05,0.8, M.grass, totalW/2,-0.02,-1.1-i*3, g);
  }

  // Flower beds along pathway
  box(1,0.3,8, mat(0x3a5a2a,{roughness:1}), totalW/2-2.2,-0.05,-6, g);
  box(1,0.3,8, mat(0x3a5a2a,{roughness:1}), totalW/2+2.2,-0.05,-6, g);
  // Flowers
  const flowerCols=[0xff4466,0xffaa22,0xff6699,0xffdd22,0xee4444];
  for(let i=0;i<12;i++){
    sph(0.18,mat(flowerCols[i%5],{roughness:0.9}), totalW/2-2.2+Math.sin(i)*0.3,0.2,-2-i*0.6, g);
    sph(0.18,mat(flowerCols[(i+2)%5],{roughness:0.9}), totalW/2+2.2+Math.cos(i)*0.3,0.2,-2-i*0.6, g);
  }

  // Flower beds along front facade
  box(14,0.3,1.5, mat(0x3a5a2a,{roughness:1}), totalW/2,0,-1, g);
  for(let i=0;i<8;i++){
    sph(0.2,mat(flowerCols[i%5],{roughness:0.9}), 2+i*1.6,0.22,-1.2, g);
  }

  // 4 Trees (layered foliage spheres)
  const treePosns=[[-8,totalL*0.3],[-8,totalL*0.7],[30,totalL*0.2],[30,totalL*0.75]];
  const tMat1=mat(0x2a7a30,{roughness:0.9});
  const tMat2=mat(0x1f6625,{roughness:0.9});
  treePosns.forEach(([tx,tz])=>{
    cyl(0.25,0.4,7, M.dkWood, tx,3.5,tz, g);
    sph(2.2,tMat1, tx,7.5,tz, g);
    sph(1.8,tMat2, tx+0.7,6.5,tz+0.5, g);
    sph(1.5,tMat1, tx-0.5,8.5,tz-0.4, g);
    sph(1.2,tMat2, tx+0.3,9.5,tz, g);
  });

  // Fountain (tiered, with cyan glow)
  cyl(2.5,2.8,0.4,M.ggTrim, -5,0.2,totalL*0.5, g);
  cyl(1.8,2.0,0.3,M.ggTrim, -5,0.6,totalL*0.5, g);
  cyl(0.5,0.8,0.25,M.ggTrim, -5,0.9,totalL*0.5, g);
  cyl(0.1,0.1,1.2,M.chrome, -5,1.25,totalL*0.5, g); // spout
  // Water (blue transparent disc)
  cyl(2.3,2.3,0.05,mat(0x66aaee,{transparent:true,opacity:0.6}), -5,0.42,totalL*0.5, g);
  cyl(1.6,1.6,0.05,mat(0x88bbff,{transparent:true,opacity:0.6}), -5,0.72,totalL*0.5, g);

  // Car porch slab (right side of house)
  box(10,0.2,16, M.slab, totalW+5,0.1,10, g);
  // Porch columns
  cyl(0.3,0.3,gfH,M.pillar, totalW+0.5,gfH/2,2, g);
  cyl(0.3,0.3,gfH,M.pillar, totalW+9.5,gfH/2,2, g);
  cyl(0.3,0.3,gfH,M.pillar, totalW+0.5,gfH/2,16, g);
  cyl(0.3,0.3,gfH,M.pillar, totalW+9.5,gfH/2,16, g);
  // Porch slab roof
  box(10,0.3,16, M.slab, totalW+5,gfH+0.15,10, g);

  // Parked car (simple block representation)
  box(6.5,3.5,11, mat(0x2244aa,{roughness:0.3,metalness:0.5}), totalW+5,1.75+0.1,10, g);
  box(5,2,7, mat(0x4466cc,{roughness:0.1,metalness:0.4}), totalW+5,2.8+0.1,10.5, g); // cabin
  // Wheels
  [[totalW+2.3,0.6,4],[totalW+7.7,0.6,4],[totalW+2.3,0.6,16],[totalW+7.7,0.6,16]].forEach(([wx,wy,wz])=>{
    cyl(0.8,0.8,0.6,mat(0x111111), wx,wy,wz, g, 16);
    cyl(0.4,0.4,0.65,M.chrome, wx,wy,wz, g, 16);
  });
  // Headlights
  box(0.5,0.4,0.1, mat(0xffffcc,{emissive:0xffffcc,emissiveIntensity:0.5}), totalW+3.5,1.8,4.45, g);
  box(0.5,0.4,0.1, mat(0xffffcc,{emissive:0xffffcc,emissiveIntensity:0.5}), totalW+6.5,1.8,4.45, g);

  // Exterior wall sconces (at entry, both sides of door)
  box(0.15,0.6,0.5, M.amber, totalW/2-2.8,6.5,-0.01, extG);
  box(0.15,0.6,0.5, M.amber, totalW/2+2.8,6.5,-0.01, extG);
}

/* ════════════════════════════════════════════════
   LIGHTING
   ════════════════════════════════════════════════ */
const ambientLight = new THREE.AmbientLight(0xfff5e0, 0.4);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffbe8, 1.5);
sunLight.position.set(25,35,20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048,2048);
sunLight.shadow.camera.left=-60; sunLight.shadow.camera.right=60;
sunLight.shadow.camera.top=80; sunLight.shadow.camera.bottom=-20;
sunLight.shadow.camera.near=1; sunLight.shadow.camera.far=200;
sunLight.shadow.bias=-0.002;
scene.add(sunLight);

const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x8B7355, 0.5);
scene.add(hemiLight);

const moonLight = new THREE.DirectionalLight(0x4466aa, 0.3);
moonLight.position.set(-20,30,-15);
moonLight.visible = false;
scene.add(moonLight);

// Interior room lights
const intLights = [];
function addIntLight(x,y,z,col=0xffedd0,intensity=2.0,range=12) {
  const l=new THREE.PointLight(col,intensity,range);
  l.position.set(x,y,z);
  l.castShadow=false;
  scene.add(l);
  intLights.push(l);
  return l;
}

// GF rooms
addIntLight(totalW/2, gfH-1.5, (hallZ+hallEndZ)/2, 0xffedd0, 2.0, 14); // hall
addIntLight(totalW/2, gfH-1.5, hallZ/2, 0xfff5e0, 1.8, 12); // kitchen
addIntLight((wallT+toiletX)/2, gfH-1.5, (hallEndZ+totalL)/2, 0xffedd0, 1.8, 12); // bedroom
addIntLight((toiletX+totalW)/2, gfH-1.5, (hallEndZ+totalL)/2, 0xfff8f8, 1.5, 8); // bathroom

// FF rooms
const ffB=gfH+slabT;
addIntLight(totalW/2, ffB+ffH-1.5, (hallZ+hallEndZ)/2, 0xffedd0, 1.8, 12);
addIntLight((wallT+toiletX)/2, ffB+ffH-1.5, (hallEndZ+totalL)/2, 0xffedd0, 1.8, 12);

// Pendant lights (GF hall)
addIntLight(totalW/2-2.5, gfH-1.3, hallZ+wallT+6, 0xffeedd, 1.2, 6);
addIntLight(totalW/2+2.5, gfH-1.3, hallZ+wallT+6, 0xffeedd, 1.2, 6);

// Kitchen peninsula pendant
addIntLight(4.5, gfH-1.5, hallZ-1.5, 0xfff5e0, 1.0, 5);

// Exterior sconces
addIntLight(totalW/2-2.8, 6.5, -1, 0xffcc44, 1.5, 8);
addIntLight(totalW/2+2.8, 6.5, -1, 0xffcc44, 1.5, 8);

// Fountain glow
const fountainLight = new THREE.PointLight(0x44ccff, 1.5, 6);
fountainLight.position.set(-5, 1, totalL*0.5);
scene.add(fountainLight);

/* ════════════════════════════════════════════════
   SKY + STARS
   ════════════════════════════════════════════════ */
const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(280,32,16),
  M.skyDay
);
scene.add(skyDome);

// Stars (hidden by default)
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for(let i=0;i<2000;i++){
  const theta=Math.random()*Math.PI*2;
  const phi=Math.acos(2*Math.random()-1);
  const r=270;
  starVerts.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts,3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.8}));
stars.visible = false;
scene.add(stars);

// Moon mesh
const moonMesh = new THREE.Mesh(
  new THREE.SphereGeometry(4,12,8),
  mat(0xeeeedd,{emissive:0xddddcc,emissiveIntensity:0.5})
);
moonMesh.position.set(-100, 120, -80);
moonMesh.visible = false;
scene.add(moonMesh);

/* ════════════════════════════════════════════════
   BUILD EVERYTHING
   ════════════════════════════════════════════════ */
buildGFShell();
buildFFShell();
buildPillars();
buildOpenings();
buildBalcony();
buildStairs();
buildGFHall();
buildGFKitchen();
buildGFBedroom();
buildGFBath();
buildFFInteriors();
buildExterior();

/* ════════════════════════════════════════════════
   VIEW PRESETS
   ════════════════════════════════════════════════ */
const VIEWS = {
  ext:  {cam:[38,26,50],  tgt:[7.75,8,22]},
  elev: {cam:[7.75,12,-20],tgt:[7.75,8,0]},
  gf:   {cam:[7.75,8,14], tgt:[7.75,5,30]},
  ff:   {cam:[7.75,21,14],tgt:[7.75,18,30]},
  cut:  {cam:[-10,15,28], tgt:[7.75,8,22]},
  top:  {cam:[7.75,55,22],tgt:[7.75,0,22]},
};

function gotoView(name) {
  const v=VIEWS[name]; if(!v) return;
  camera.position.set(...v.cam);
  controls.target.set(...v.tgt);
  controls.update();
}

/* ════════════════════════════════════════════════
   TOGGLE FUNCTIONS
   ════════════════════════════════════════════════ */
const state = {gf:true, ff:true, ext:true, furn:true, lights:true, night:false};

function toggleGroup(name) {
  state[name] = !state[name];
  const grp = name==='gf'?gfG : name==='ff'?ffG : extG;
  grp.visible = state[name];
  document.getElementById('btn-'+name).classList.toggle('on', state[name]);
}

function toggleFurn() {
  state.furn = !state.furn;
  furnG.visible = state.furn;
  document.getElementById('btn-furn').classList.toggle('on', state.furn);
}

function toggleLights() {
  state.lights = !state.lights;
  intLights.forEach(l => l.visible = state.lights);
  document.getElementById('btn-lights').classList.toggle('on', state.lights);
}

function toggleNight() {
  state.night = !state.night;
  document.getElementById('btn-night').classList.toggle('on', state.night);
  if(state.night) {
    skyDome.material = M.skyNight;
    scene.fog.color.setHex(0x05050f);
    scene.background = new THREE.Color(0x05050f);
    ambientLight.intensity = 0.08;
    sunLight.visible = false;
    hemiLight.intensity = 0.05;
    moonLight.visible = true;
    stars.visible = true;
    moonMesh.visible = true;
    fountainLight.intensity = 2.5;
    intLights.forEach(l => { l.intensity *= 1.5; });
  } else {
    skyDome.material = M.skyDay;
    scene.fog.color.setHex(0x87CEEB);
    scene.background = null;
    ambientLight.intensity = 0.4;
    sunLight.visible = true;
    hemiLight.intensity = 0.5;
    moonLight.visible = false;
    stars.visible = false;
    moonMesh.visible = false;
    fountainLight.intensity = 1.5;
    intLights.forEach(l => { l.intensity /= 1.5; });
  }
}

function resetCamera() {
  gotoView('ext');
}

function togglePanel() {
  const body = document.getElementById('panel-body');
  const arrow = document.getElementById('toggle-arrow');
  body.classList.toggle('collapsed');
  arrow.textContent = body.classList.contains('collapsed') ? '▼' : '▲';
}

// Auto-collapse on mobile
if(window.innerWidth < 480) {
  document.getElementById('panel-body').classList.add('collapsed');
  document.getElementById('toggle-arrow').textContent = '▼';
}

// Touch vs mouse hint
if('ontouchstart' in window) {
  document.getElementById('hint').textContent = 'Drag to orbit · Pinch to zoom · 2-finger pan';
}

/* ════════════════════════════════════════════════
   RESIZE + RENDER LOOP
   ════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  // Gentle fountain light pulse
  fountainLight.intensity = 1.5 + Math.sin(Date.now()*0.002)*0.3;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
