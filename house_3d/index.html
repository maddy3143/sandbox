<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D House Model – 2-Floor Residence</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;background:#87CEEB;}
  canvas{display:block;}
  #ui{position:fixed;top:14px;left:14px;z-index:10;width:200px;}
  #panel{background:rgba(10,12,28,.88);backdrop-filter:blur(12px);color:#fff;border-radius:12px;border:1px solid rgba(255,255,255,.15);padding:14px;}
  #panel h2{font-size:13px;font-weight:700;color:#FFD700;margin-bottom:2px;letter-spacing:.8px;}
  #panel p{font-size:10px;color:#aaa;margin-bottom:10px;}
  .sec{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;margin:10px 0 4px;}
  .btn{display:block;width:100%;margin:3px 0;padding:7px 10px;background:rgba(255,255,255,.08);color:#ddd;border:1px solid rgba(255,255,255,.18);border-radius:6px;cursor:pointer;font-size:11px;text-align:left;transition:.18s;}
  .btn:hover{background:rgba(255,215,0,.18);border-color:#FFD700;color:#FFD700;}
  .btn.on{background:rgba(255,215,0,.22);border-color:#FFD700;color:#FFD700;}
  #hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:rgba(255,255,255,.8);padding:6px 18px;border-radius:20px;font-size:11px;pointer-events:none;}
  #legend{position:fixed;bottom:16px;right:16px;background:rgba(10,12,28,.82);color:#ccc;border-radius:8px;padding:10px 14px;font-size:11px;border:1px solid rgba(255,255,255,.12);}
  #legend b{color:#FFD700;display:block;margin-bottom:4px;}
  #legend span{display:block;margin:2px 0;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
</style>
</head>
<body>

<div id="ui">
  <div id="panel">
    <h2>🏠 2-FLOOR RESIDENCE</h2>
    <p>15'6" × 44' · GF+FF</p>

    <div class="sec">View Preset</div>
    <button class="btn on" onclick="setView('ext')">🌅 Exterior</button>
    <button class="btn"    onclick="setView('elev')">🏛️ Front Elevation</button>
    <button class="btn"    onclick="setView('gf')">🛋️ GF Interior</button>
    <button class="btn"    onclick="setView('ff')">🛏️ FF Interior</button>
    <button class="btn"    onclick="setView('cut')">✂️ Cutaway</button>
    <button class="btn"    onclick="setView('top')">📐 Floor Plan</button>

    <div class="sec">Floors</div>
    <button class="btn on" onclick="showFloors('both')">Both Floors</button>
    <button class="btn"    onclick="showFloors('gf')">Ground Floor</button>
    <button class="btn"    onclick="showFloors('ff')">First Floor</button>

    <div class="sec">Toggles</div>
    <button class="btn on" id="btnFurn"  onclick="toggle('furn')">Furniture</button>
    <button class="btn on" id="btnLight" onclick="toggle('light')">Interior Lights</button>
    <button class="btn on" id="btnExt"   onclick="toggle('ext_el')">Exterior</button>
    <button class="btn"    onclick="setView('ext')">↺ Reset Camera</button>
  </div>
</div>

<div id="hint">🖱 Left-drag: Rotate &nbsp;|&nbsp; Right-drag: Pan &nbsp;|&nbsp; Scroll: Zoom</div>

<div id="legend">
  <b>Materials</b>
  <span><span class="dot" style="background:#1a1a3e"></span>Galaxy Granite</span>
  <span><span class="dot" style="background:#8B4513"></span>Teak Wood</span>
  <span><span class="dot" style="background:#e8dfd0"></span>Lapotea Stone</span>
  <span><span class="dot" style="background:#e0efff"></span>Ceramic Tile</span>
  <span><span class="dot" style="background:#f0ead6"></span>Plaster Wall</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// RENDERER + SCENE
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.FogExp2(0x87CEEB,.007);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 600);
camera.position.set(38,26,50);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(7.75,7,22);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.maxPolarAngle = Math.PI*.88;
controls.update();

// ─────────────────────────────────────────────────────────────────────────────
// LIGHTING
// ─────────────────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff5e0,.45));

const sun = new THREE.DirectionalLight(0xfff5e0,1.6);
sun.position.set(25,35,20);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(2048);
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:.5,far:120});
scene.add(sun);

scene.add(new THREE.HemisphereLight(0x87CEEB,0x8B7355,.55));

const iLights=[];
function iLight(x,y,z,c=0xfff8dc,i=2.2,r=14){
  const l=new THREE.PointLight(c,i,r);
  l.position.set(x,y,z); scene.add(l); iLights.push(l); return l;
}
// GF
iLight(7.75,9.5, 4);   // entry/stair
iLight(7.75,9.5,14);   // kitchen
iLight(7.75,9.5,22);   // hall
iLight(7.75,9.5,36);   // bedroom
iLight(13.2,9.5,39);   // toilet
// FF
iLight(7.75,21.8,10);
iLight(7.75,21.8,22);
iLight(7.75,21.8,36);

// ─────────────────────────────────────────────────────────────────────────────
// PROCEDURAL TEXTURES
// ─────────────────────────────────────────────────────────────────────────────
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

function galaxyGraniteTex(){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  x.fillStyle='#14142a'; x.fillRect(0,0,512,512);
  for(let i=0;i<4000;i++){
    const px=Math.random()*512,py=Math.random()*512,r=Math.random()*2.5+.3;
    x.beginPath();x.arc(px,py,r,0,6.28);
    const g=Math.random();
    x.fillStyle=g>.7?`rgba(220,220,240,${Math.random()*.7+.2})`:
                 g>.4?`rgba(160,160,200,${Math.random()*.5+.1})`:
                      `rgba(80,80,140,${Math.random()*.4+.1})`;
    x.fill();
  }
  // veins
  for(let i=0;i<8;i++){
    x.beginPath();
    x.moveTo(Math.random()*512,Math.random()*512);
    for(let j=0;j<6;j++) x.lineTo(Math.random()*512,Math.random()*512);
    x.strokeStyle=`rgba(200,200,230,${Math.random()*.12+.04})`;
    x.lineWidth=Math.random()*1.5+.3; x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,2); return t;
}

function woodTex(base='#6B3010',grain='#3d1a05'){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  x.fillStyle=base; x.fillRect(0,0,512,512);
  for(let i=0;i<60;i++){
    const y=Math.random()*512, w=Math.random()*5+1;
    x.beginPath(); x.moveTo(0,y);
    let px=0;
    while(px<512){px+=4+Math.random()*12;x.lineTo(px,y+(Math.random()-.5)*4);}
    x.strokeStyle=grain; x.globalAlpha=Math.random()*.25+.1;
    x.lineWidth=w; x.stroke();
  }
  x.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,4); return t;
}

function tileTex(c1='#eeeeee',c2='#d8d8d8',sz=48){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  const n=512/sz;
  for(let r=0;r<n;r++) for(let cl=0;cl<n;cl++){
    x.fillStyle=(r+cl)%2===0?c1:c2;
    x.fillRect(cl*sz+1,r*sz+1,sz-2,sz-2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}

function lapoteaTex(){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  x.fillStyle='#d4c9b0'; x.fillRect(0,0,512,512);
  for(let i=0;i<1500;i++){
    x.fillStyle=`rgba(${100+Math.random()*60},${90+Math.random()*50},${60+Math.random()*40},${Math.random()*.3})`;
    x.fillRect(Math.random()*512,Math.random()*512,Math.random()*4+1,Math.random()*4+1);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}

function plasterTex(){
  const c=mkCanvas(256,256),x=c.getContext('2d');
  x.fillStyle='#f0ead6'; x.fillRect(0,0,256,256);
  for(let i=0;i<2000;i++){
    x.fillStyle=`rgba(${Math.floor(Math.random()*30)},${Math.floor(Math.random()*25)},${Math.floor(Math.random()*15)},${Math.random()*.12})`;
    x.fillRect(Math.random()*256,Math.random()*256,2,2);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}

// ─────────────────────────────────────────────────────────────────────────────
// MATERIALS
// ─────────────────────────────────────────────────────────────────────────────
const T={
  gg:   galaxyGraniteTex(),
  wood: woodTex(),
  dkwood: woodTex('#3d1a05','#1a0800'),
  tile: tileTex(),
  bathtile: tileTex('#ddeeff','#b8cce0',40),
  lap:  lapoteaTex(),
  plaster: plasterTex(),
};

const M={
  extWall: new THREE.MeshStandardMaterial({map:T.plaster,color:0xede5d0,roughness:.85}),
  intWall: new THREE.MeshStandardMaterial({color:0xfaf4e8,roughness:.9}),
  ggFloor: new THREE.MeshStandardMaterial({map:T.gg,color:0x1e1e38,roughness:.15,metalness:.45}),
  ggTrim:  new THREE.MeshStandardMaterial({map:T.gg,color:0x14142a,roughness:.08,metalness:.6}),
  ggCounter:new THREE.MeshStandardMaterial({map:T.gg,color:0x1a1a30,roughness:.06,metalness:.55}),
  wood:    new THREE.MeshStandardMaterial({map:T.wood,color:0x7a3a12,roughness:.6,metalness:.05}),
  dkWood:  new THREE.MeshStandardMaterial({map:T.dkwood,color:0x3d1a05,roughness:.55,metalness:.08}),
  lap:     new THREE.MeshStandardMaterial({map:T.lap,color:0xc8bda5,roughness:.4,metalness:.05}),
  tile:    new THREE.MeshStandardMaterial({map:T.tile,color:0xeef4ff,roughness:.25,metalness:.1}),
  bathTile:new THREE.MeshStandardMaterial({map:T.bathtile,color:0xe0eeff,roughness:.2,metalness:.12}),
  slab:    new THREE.MeshStandardMaterial({color:0xd0c8bc,roughness:.9}),
  ceil:    new THREE.MeshStandardMaterial({color:0xfaf8f5,roughness:.95}),
  glass:   new THREE.MeshStandardMaterial({color:0xadd8e6,transparent:true,opacity:.28,roughness:.02,metalness:.12}),
  winFrame:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,metalness:.2}),
  metal:   new THREE.MeshStandardMaterial({color:0xa0a8b0,roughness:.2,metalness:.9}),
  gold:    new THREE.MeshStandardMaterial({color:0xd4af37,roughness:.1,metalness:.95}),
  white:   new THREE.MeshStandardMaterial({color:0xfefefe,roughness:.35,metalness:.05}),
  blue:    new THREE.MeshStandardMaterial({color:0x3a6ea5,roughness:.6}),
  red:     new THREE.MeshStandardMaterial({color:0x9b2335,roughness:.6}),
  green:   new THREE.MeshStandardMaterial({color:0x2d6a2d,roughness:.9}),
  treeLeaf:new THREE.MeshStandardMaterial({color:0x228B22,roughness:.95}),
  pillar:  new THREE.MeshStandardMaterial({color:0xe8dfd0,roughness:.5}),
  grass:   new THREE.MeshStandardMaterial({color:0x3a7d2a,roughness:1}),
  path:    new THREE.MeshStandardMaterial({map:T.gg,color:0x303845,roughness:.35,metalness:.2}),
  poojaWall:new THREE.MeshStandardMaterial({color:0xffe4b5,roughness:.8}),
  cpndWall:new THREE.MeshStandardMaterial({color:0xddd5c0,roughness:.8}),
  stair:   new THREE.MeshStandardMaterial({map:T.lap,color:0xbcb09a,roughness:.35,metalness:.05}),
  stairRiser:new THREE.MeshStandardMaterial({map:T.tile,color:0xe0eeff,roughness:.25,metalness:.08}),
};

// ─────────────────────────────────────────────────────────────────────────────
// GROUPS
// ─────────────────────────────────────────────────────────────────────────────
const gfG=new THREE.Group(), ffG=new THREE.Group();
const furnG=new THREE.Group(), extG=new THREE.Group();
scene.add(gfG,ffG,furnG,extG);

// ─────────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function box(w,h,d,mat,x,y,z,grp=gfG,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true; grp.add(m); return m;
}
function cyl(rt,rb,h,mat,x,y,z,grp=gfG,seg=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; grp.add(m); return m;
}
function sph(r,mat,x,y,z,grp=extG){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),mat);
  m.position.set(x,y,z); m.castShadow=true; grp.add(m); return m;
}

// ─────────────────────────────────────────────────────────────────────────────
// DIMENSIONS  (1 unit = 1 foot)
// ─────────────────────────────────────────────────────────────────────────────
const D={
  tw:15.5, tl:44, wt:.75,  // total width/length, wall thickness
  iw:13.75,                 // inner width (13'9")
  gfH:10.75,                // GF slab height 10'9"
  ffH:7.83,                 // FF wall height 7'10"
  slabT:.5,
  para:1.5,                 // parapet
  cx:7.75,                  // centre x
  // room z-positions (from front face z=0)
  staEndZ:14,   // staircase / kitchen zone end
  hallEndZ:30,  // hall end / bedroom start
};
const GFT = D.gfH+D.slabT;  // top of GF slab = base of FF floor

// ─────────────────────────────────────────────────────────────────────────────
// DOOR & WINDOW HELPERS
// ─────────────────────────────────────────────────────────────────────────────
function addWindow(grp,cx,cy,cz,ww,wh,axis){
  // axis: 'x'=wall faces Z, 'z'=wall faces X
  if(axis==='x'){
    box(ww,wh,.08,M.glass,cx,cy,cz,grp);
    box(ww+.2,.1,.12,M.winFrame,cx,cy+wh/2,cz,grp);
    box(ww+.2,.1,.12,M.winFrame,cx,cy-wh/2,cz,grp);
    box(.1,wh+.2,.12,M.winFrame,cx-ww/2,cy,cz,grp);
    box(.1,wh+.2,.12,M.winFrame,cx+ww/2,cy,cz,grp);
    box((ww-.1)/2,.05,.08,M.winFrame,cx,cy,cz,grp); // centre bar
  } else {
    box(.08,wh,ww,M.glass,cx,cy,cz,grp);
    box(.12,.1,ww+.2,M.winFrame,cx,cy+wh/2,cz,grp);
    box(.12,.1,ww+.2,M.winFrame,cx,cy-wh/2,cz,grp);
    box(.12,wh+.2,.1,M.winFrame,cx,cy,cz-ww/2,grp);
    box(.12,wh+.2,.1,M.winFrame,cx,cy,cz+ww/2,grp);
    box(.08,.05,ww,M.winFrame,cx,cy,cz,grp);
  }
}

function mainDoor(grp,cx,cz,y0=0){
  const dw=3.5,dh=7;
  // Galaxy granite frame
  box(dw+.5,.3,.2,M.ggTrim,cx,y0+dh+.15,cz,grp);
  box(.25,dh,.2,M.ggTrim,cx-dw/2-.125,y0+dh/2,cz,grp);
  box(.25,dh,.2,M.ggTrim,cx+dw/2+.125,y0+dh/2,cz,grp);
  // Two door leaves (dark teak)
  box(dw/2-.1,dh-.1,.16,M.dkWood,cx-dw/4,y0+dh/2,cz,grp);
  box(dw/2-.1,dh-.1,.16,M.dkWood,cx+dw/4,y0+dh/2,cz,grp);
  // Raised panels on each leaf
  box(dw/2-.35,2.4,.06,M.wood,cx-dw/4,y0+dh-2,cz-.05,grp);
  box(dw/2-.35,3.,.06,M.wood,cx-dw/4,y0+2.2,cz-.05,grp);
  box(dw/2-.35,2.4,.06,M.wood,cx+dw/4,y0+dh-2,cz-.05,grp);
  box(dw/2-.35,3.,.06,M.wood,cx+dw/4,y0+2.2,cz-.05,grp);
  // Gold handles
  cyl(.04,.04,.7,M.gold,cx-.55,y0+3.5,cz-.14,grp,16);
  cyl(.04,.04,.7,M.gold,cx+.55,y0+3.5,cz-.14,grp,16);
  box(.06,.06,.3,M.gold,cx-.55,y0+3.5,cz-.28,grp);
  box(.06,.06,.3,M.gold,cx+.55,y0+3.5,cz-.28,grp);
}

function intDoor(grp,cx,cz,y0=0,dw=3,dh=7,mat=M.dkWood){
  // Granite frame
  box(dw+.3,.2,.18,M.ggTrim,cx,y0+dh+.1,cz,grp);
  box(.2,dh,.18,M.ggTrim,cx-dw/2-.1,y0+dh/2,cz,grp);
  box(.2,dh,.18,M.ggTrim,cx+dw/2+.1,y0+dh/2,cz,grp);
  box(dw-.08,dh-.08,.12,mat,cx,y0+dh/2,cz,grp);
  box(dw-.35,2.,.05,M.wood,cx,y0+dh-1.5,cz-.07,grp);
  box(dw-.35,3.2,.05,M.wood,cx,y0+2.2,cz-.07,grp);
  cyl(.03,.03,.55,M.gold,cx+.6,y0+3.5,cz-.12,grp,12);
}

// ─────────────────────────────────────────────────────────────────────────────
// STAIRCASE (2 flights + midland landing)
// ─────────────────────────────────────────────────────────────────────────────
function buildStairs(){
  const sw=3.0, td=.75, rh=.583;
  const sx=D.wt+.1;  // left side x
  // Flight 1: 10 steps from z=D.wt, going back (z+)
  for(let i=0;i<10;i++){
    const tz=D.wt+i*td+td/2, ty=rh/2+i*rh;
    box(sw,rh,td,M.stairRiser,sx+sw/2,ty,tz,gfG);
    box(sw,.08,td+.02,M.stair,sx+sw/2,ty+rh/2+.04,tz,gfG);
  }
  // Midland landing at z≈8.25, y=5.83
  const mlZ=D.wt+10*td, mlY=10*rh;
  box(sw,.12,2.75,M.lap,sx+sw/2,mlY+.06,mlZ+1.375,gfG);
  // Flight 2: 9 steps up to FF
  for(let i=0;i<9;i++){
    const tz=mlZ+2.75+i*td+td/2, ty=mlY+rh/2+i*rh;
    box(sw,rh,td,M.stairRiser,sx+sw/2,ty,tz,gfG);
    box(sw,.08,td+.02,M.stair,sx+sw/2,ty+rh/2+.04,tz,gfG);
  }
  // Stair wall (left side enclosure)
  box(D.wt,D.gfH,D.staEndZ,M.intWall,sx,D.gfH/2,D.staEndZ/2,gfG);
  // Metal railings
  const railX=sx+sw-.1;
  for(let i=0;i<=10;i+=2){
    const tz=D.wt+i*td, ty=i*rh;
    cyl(.04,.04,1,M.metal,railX,ty+.5,tz,gfG,8);
  }
  // Handrail along flight 1
  box(.06,.06,10*td+.5,M.wood,railX,10*rh/2+.6,D.wt+5*td,gfG,0,0,Math.atan2(10*rh,10*td));
}

// ─────────────────────────────────────────────────────────────────────────────
// POOJA NICHE
// ─────────────────────────────────────────────────────────────────────────────
function buildPooja(grp,x,z,yBase=0){
  // Recessed niche, arch top
  box(2,.08,.75,M.wood,x,yBase+3.1,z+.35,grp);       // shelf
  box(1.9,3.5,.04,M.poojaWall,x,yBase+4.55,z+.36,grp); // back panel
  box(2,.12,.8,M.ggTrim,x,yBase+2.9,z+.35,grp);       // granite shelf
  // Arch
  const ag=new THREE.CylinderGeometry(1,.95,.04,16,1,false,0,Math.PI);
  const am=new THREE.Mesh(ag,M.poojaWall); am.rotation.set(Math.PI/2,Math.PI,0);
  am.position.set(x,yBase+6.4,z+.36); grp.add(am);
  // Warm golden light
  const pl=new THREE.PointLight(0xffcc44,2.5,6);
  pl.position.set(x,yBase+5.5,z); grp.add(pl); iLights.push(pl);
  // Decorative lamp on shelf
  cyl(.08,.12,.3,M.gold,x,yBase+3.3,z+.15,grp,12);
  cyl(.15,.05,.05,M.gold,x,yBase+3.5,z+.15,grp,12);
}

// ─────────────────────────────────────────────────────────────────────────────
// KITCHEN
// ─────────────────────────────────────────────────────────────────────────────
function buildKitchen(grp,x1,x2,z1,z2){
  const cx=(x1+x2)/2, cz=(z1+z2)/2;
  const ctrH=3.0, ctrD=2.25;
  // L-shaped galaxy granite counter
  // Along right wall
  box(ctrD,ctrH,z2-z1-1,M.ggCounter, x2-ctrD/2,ctrH/2,cz-.5,grp);
  box(ctrD+.25,.12,z2-z1-1,M.ggTrim, x2-ctrD/2+.05,ctrH+.06,cz-.5,grp);
  // Along back wall (z=z2)
  box(x2-x1-ctrD,ctrH,ctrD,M.ggCounter, cx-ctrD/4,ctrH/2,z2-ctrD/2-.1,grp);
  box(x2-x1-ctrD,.12,ctrD+.25,M.ggTrim, cx-ctrD/4,ctrH+.06,z2-ctrD/2-.1,grp);
  // Overhead cabinets (wood)
  box(ctrD,3,z2-z1-1.5,M.wood, x2-ctrD/2,D.gfH-1.5,cz-.5,grp);
  box(x2-x1-ctrD,2.5,ctrD,M.wood, cx-ctrD/4,D.gfH-1.25,z2-ctrD/2-.1,grp);
  // Cabinet doors (vertical lines)
  for(let i=0;i<3;i++){
    box(.04,2.9,z2-z1-1.5,M.dkWood, x2-ctrD*.85+i*.1,D.gfH-1.5,cz-.5,grp);
  }
  // Sink
  box(1.8,.15,1.0,M.metal, x2-ctrD/2,ctrH+.08,z1+2.5,grp);
  cyl(.12,.12,.06,M.metal, x2-ctrD/2,ctrH+.22,z1+2.5,grp,12);
  cyl(.02,.02,.5,M.metal,  x2-ctrD/2+.2,ctrH+.48,z1+2.5,grp,8);
  // Stove / hob
  box(1.8,.12,.9,M.metal, x2-ctrD/2,ctrH+.06,z1+5.5,grp);
  for(let bi=0;bi<4;bi++){
    cyl(.15,.15,.02,M.metal, x2-ctrD/2+(bi%2-.5)*.6,ctrH+.14,(z1+5.5)+(Math.floor(bi/2)-.5)*.35,grp,16);
  }
  // Kitchen dadoing (ceramic tiles lower 1.75' of right wall)
  box(.06,1.75,z2-z1-.5,M.tile, x2-.03,D.wt+.875,cz,grp);
  // Exhaust/chimney
  box(.5,2,.4,M.metal, x2-ctrD/2,D.gfH-1,z1+5.5,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// BATHROOM
// ─────────────────────────────────────────────────────────────────────────────
function buildBath(grp,x1,x2,z1,z2,yBase=0){

  box(x2-x1,0.12,z2-z1,M.bathTile, (x1+x2)/2,yBase+.06,cz,grp);
  // Wall tiles lower 5ft
  box(.06,5,z2-z1,M.bathTile, x1+.03,yBase+2.5,cz,grp);
  box(.06,5,z2-z1,M.bathTile, x2-.03,yBase+2.5,cz,grp);

  box(1.6,1.4,2.2,M.white,(x1+x2)/2+.8,yBase+.7,z1+1.6,grp);
  box(1.4,.35,1.4,M.white,(x1+x2)/2+.8,yBase+1.55,z1+.9,grp);
  // Basin
  box(1.7,.7,1.0,M.white, (x1+x2)/2-.9,yBase+2.55,z2-.8,grp);
  cyl(.1,.15,.5,M.white, (x1+x2)/2-.9,yBase+2.1,z2-.8,grp,12);
  cyl(.02,.02,.5,M.metal, (x1+x2)/2-.7,yBase+3.1,z2-.8,grp,8);
  // Shower corner
  box(.08,7,z2-z1,M.glass,(x1+x2)/2+.5,yBase+3.5,cz,grp);

}

// ─────────────────────────────────────────────────────────────────────────────
// BEDROOM
// ─────────────────────────────────────────────────────────────────────────────
function buildBed(grp,x1,x2,z1,z2,yBase=0,col=M.blue){
  const cx=(x1+x2)/2, cz=(z1+z2)/2;
  const bw=6.5,bd=7;
  const bx=cx, bz=cz+1.5;
  // Bed base
  box(bw,.5,bd,M.dkWood,bx,yBase+.25,bz,grp);
  // Mattress
  box(bw-.2,.45,bd-.3,M.white,bx,yBase+.7,bz,grp);
  // Bedsheet
  box(bw-.2,.06,bd-.3,col,bx,yBase+.93,bz,grp);
  // Pillows
  box(1.8,.3,1.1,M.white,bx-1.8,yBase+1.02,bz-2.5,grp);
  box(1.8,.3,1.1,M.white,bx+1.8,yBase+1.02,bz-2.5,grp);
  // Headboard
  box(bw+.2,2.8,.25,M.dkWood,bx,yBase+1.65,bz-bd/2-.12,grp);
  box(bw-.3,2.4,.08,M.wood,bx,yBase+1.8,bz-bd/2-.25,grp);
  // Bedside tables
  box(1.5,1.6,1.5,M.wood,bx-bw/2-.9,yBase+.8,bz-1.5,grp);
  box(1.5,1.6,1.5,M.wood,bx+bw/2+.9,yBase+.8,bz-1.5,grp);
  // Lamps
  cyl(.06,.1,.5,M.gold,bx-bw/2-.9,yBase+1.85,bz-1.5,grp,10);
  cyl(.2,.2,.04,M.white,bx-bw/2-.9,yBase+2.1,bz-1.5,grp,12);
  cyl(.06,.1,.5,M.gold,bx+bw/2+.9,yBase+1.85,bz-1.5,grp,10);
  cyl(.2,.2,.04,M.white,bx+bw/2+.9,yBase+2.1,bz-1.5,grp,12);
  // Wardrobe (sliding, 6ft wide x 8ft tall)
  box(6,.12,2,M.ggTrim,x2-1.25,yBase+8+.06,cz-2,grp);    // top rail
  box(6,8,2,M.dkWood, x2-1.25,yBase+4,cz-2,grp);
  box(.04,8,2.1,M.ggTrim, x2-1.25,yBase+4,cz-2,grp);     // centre divider
  box(6.1,.12,2.1,M.ggTrim,x2-1.25,yBase+.06,cz-2,grp);   // bottom track
  // Mirror / dressing table
  box(3,4.5,.08,M.glass, x1+D.wt+1.8,yBase+4,z1+1.2,grp);
  box(3.2,.12,1.4,M.wood, x1+D.wt+1.8,yBase+2.5,z1+1.5,grp);
  box(3.2,2.5,.1,M.dkWood,x1+D.wt+1.8,yBase+1.25,z1+1.95,grp);
  // Ceiling fan
  cyl(.06,.06,1,M.metal,cx,yBase+D.gfH-.5,cz,grp,8);
  box(4.5,.08,.25,M.metal,cx,yBase+D.gfH-1,cz,grp);
  box(.25,.08,4.5,M.metal,cx,yBase+D.gfH-1,cz,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// HALL FURNITURE
// ─────────────────────────────────────────────────────────────────────────────
function buildHallFurn(grp,x1,x2,z1,z2,yBase=0){
  const cx=(x1+x2)/2, cz=(z1+z2)/2;
  // 3-seater sofa (along back wall)
  box(8,1.6,2.8,M.blue,cx,yBase+.8,z2-2.2,grp);
  box(8,2.2,.45,M.blue,cx,yBase+1.6,z2-.35,grp);
  box(.45,2.8,2.8,M.blue,cx-4.22,yBase+1,z2-2.2,grp);
  box(.45,2.8,2.8,M.blue,cx+4.22,yBase+1,z2-2.2,grp);
  // Cushions
  for(let i=-1;i<=1;i++)
    box(2.2,.35,1.8,M.red,cx+i*2.6,yBase+1.8,z2-2.6,grp);
  // Coffee table
  box(3.5,.12,1.8,M.ggTrim,cx,yBase+1.5,cz,grp);
  box(3.5,.06,1.8,M.wood,cx,yBase+1.4,cz,grp);
  cyl(.06,.06,1.4,M.metal,cx-1.5,yBase+.7,cz-.7,grp,8);
  cyl(.06,.06,1.4,M.metal,cx+1.5,yBase+.7,cz-.7,grp,8);
  cyl(.06,.06,1.4,M.metal,cx-1.5,yBase+.7,cz+.7,grp,8);
  cyl(.06,.06,1.4,M.metal,cx+1.5,yBase+.7,cz+.7,grp,8);
  // TV unit (on kitchen-side wall)
  box(5.5,.8,1.6,M.dkWood,cx,yBase+.4,z1+.85,grp);
  box(4.5,2.5,.08,M.metal, cx,yBase+2.25,z1+.1,grp);   // TV screen
  box(4.5,2.5,.04,M.glass, cx,yBase+2.25,z1+.13,grp);
  // Floor lamp
  cyl(.05,.05,5.5,M.metal,x2-1.5,yBase+2.75,z2-1,grp,8);
  sph(.4,M.white,x2-1.5,yBase+5.5,z2-1,grp);
  // Centre rug suggestion
  box(5,.02,3.5,M.red,cx,yBase+.01,cz,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// ARCH (Hall arch – galaxy granite)
// ─────────────────────────────────────────────────────────────────────────────
function buildArch(grp,cx,cz,span,h,thick,yBase=0){
  const hw=span/2;
  // Two pilasters
  box(thick,h,thick,M.ggTrim,cx-hw-thick/2,yBase+h/2,cz,grp);
  box(thick,h,thick,M.ggTrim,cx+hw+thick/2,yBase+h/2,cz,grp);
  // Lintel beam
  box(span+thick*2,.35,thick,M.ggTrim,cx,yBase+h+.175,cz,grp);
  // Arch curve (half-cylinder)
  const ag=new THREE.CylinderGeometry(hw+.1,hw+.1,thick,24,1,false,0,Math.PI);
  const am=new THREE.Mesh(ag,M.ggTrim);
  am.rotation.set(Math.PI/2,0,0); am.position.set(cx,yBase+h+.1,cz); grp.add(am);
}

// ─────────────────────────────────────────────────────────────────────────────
// TREE
// ─────────────────────────────────────────────────────────────────────────────
function addTree(x,z){
  cyl(.25,.35,4.5,M.wood,x,2.25,z,extG,8);
  sph(2.8,M.treeLeaf,x,6.5,z,extG);
  sph(1.8,M.treeLeaf,x+1.5,5.5,z+.8,extG);
  sph(1.5,M.treeLeaf,x-1.2,5,z-.5,extG);
}

// ─────────────────────────────────────────────────────────────────────────────
// BUILD GROUND FLOOR
// ─────────────────────────────────────────────────────────────────────────────
function buildGF(){
  const cx=D.cx, wt=D.wt, gH=D.gfH;
  const iw=D.iw, tl=D.tl, tw=D.tw;

  // --- PLINTH ---
  box(tw+1.5,.5,tl+1.5,M.ggTrim,cx,-.25,tl/2,gfG);   // granite plinth cap
  box(tw+2,1.5,tl+2,M.pillar,cx,-1,tl/2,gfG);          // foundation

  // --- GALAXY GRANITE FLOOR ---
  box(iw,.1,tl-2*wt,M.ggFloor,cx,.05,tl/2,gfG);

  // --- OUTER WALLS ---
  // Front wall: two sides of main door (dw=3.5)
  const dw=3.5,dh=7;
  box((tw-dw)/2-wt*.5,gH,wt,M.extWall, wt+(tw-dw)/4-wt*.25, gH/2,wt/2,gfG);
  box((tw-dw)/2-wt*.5,gH,wt,M.extWall, tw-(tw-dw)/4+wt*.25, gH/2,wt/2,gfG);
  box(dw,gH-dh,wt,M.extWall, cx,dh+(gH-dh)/2,wt/2,gfG);

  // Back wall
  box(tw,gH,wt,M.extWall,cx,gH/2,tl-wt/2,gfG);
  // Left wall (windows)
  box(wt,gH,tl,M.extWall,wt/2,gH/2,tl/2,gfG);
  addWindow(gfG,wt/2,4.8,22,2.5,3.5,'z');
  addWindow(gfG,wt/2,4.8,36,2.5,3.5,'z');
  // Right wall (windows)
  box(wt,gH,tl,M.extWall,tw-wt/2,gH/2,tl/2,gfG);
  addWindow(gfG,tw-wt/2,4.8,8,2.5,3,'z');
  addWindow(gfG,tw-wt/2,4.8,22,2.5,3.5,'z');
  addWindow(gfG,tw-wt/2,4.8,36,2.5,3.5,'z');
  // Front windows (sides of door)
  addWindow(gfG,2.2,5.5,wt/2,2.2,3,'x');
  addWindow(gfG,tw-2.2,5.5,wt/2,2.2,3,'x');

  // --- INTERNAL WALLS ---
  // Staircase side wall (left side, x≈3.85, z=0..14)
  const sxW=wt+3.0;  // stair enclosure x
  box(wt,gH,D.staEndZ,M.intWall,sxW+wt/2,gH/2,D.staEndZ/2,gfG);

  // Bedroom/hall separator at z=30, door on left
  const bWZ=D.hallEndZ;
  const bdW=3.0; // door width
  box(bdW+1,gH,wt,M.intWall, wt+(bdW+1)/2,gH/2,bWZ,gfG);            // left of door
  box(tw-bdW-1-wt*2-2.5,gH,wt,M.intWall, tw-wt-(tw-bdW-1-wt*2-2.5)/2,gH/2,bWZ,gfG); // right of door
  box(bdW,gH-dh,wt,M.intWall, wt+bdW+1+bdW/2,dh+(gH-dh)/2,bWZ,gfG);// above door

  // Toilet partition walls
  const toiletX1=tw-wt-5;   // toilet 5' wide on right
  const toiletZ1=bWZ;        // toilet behind bedroom wall
  box(wt,gH,tl-wt-toiletZ1,M.intWall, toiletX1,gH/2,(toiletZ1+tl-wt)/2,gfG);
  intDoor(gfG, toiletX1+2.5, toiletZ1+.12, 0, 2.5, 7);  // toilet door

  // --- SLAB (ceiling) ---
  box(tw,D.slabT,tl,M.slab,cx,gH+D.slabT/2,tl/2,gfG);
  // Ceiling (visible from inside)
  box(iw,.04,tl-2*wt,M.ceil,cx,gH-.02,tl/2,gfG);

  // --- MAIN DOOR ---
  mainDoor(gfG,cx,wt/2);

  // --- BEDROOM DOOR ---
  intDoor(gfG, wt+bdW+1+bdW/2, bWZ);

  // --- POOJA NICHE (right of staircase at z≈12) ---
  buildPooja(gfG, sxW+2.5, 12.5);

  // --- KITCHEN (right half z=0..14) ---
  buildKitchen(gfG, sxW+wt, tw-wt, wt, D.staEndZ-wt);

  // --- HALL ARCH (galaxy granite at z=14) ---
  buildArch(gfG, cx, D.staEndZ, iw, 9, .28);

  // --- HALL FURNITURE ---
  buildHallFurn(furnG, wt, tw-wt, D.staEndZ, bWZ);

  // --- BEDROOM ---
  buildBed(furnG, wt, toiletX1, bWZ+wt, tl-wt, 0, M.blue);

  // --- TOILET ---
  buildBath(gfG, toiletX1, tw-wt, toiletZ1+wt, tl-wt);

  // --- STAIRCASE ---
  buildStairs();

  // --- GRANITE CLADDING on exterior (raindrops / 1' band) ---
  box(tw,1,wt+.04,M.ggTrim,cx,.5,wt/2,gfG);      // front
  box(tw,1,wt+.04,M.ggTrim,cx,.5,tl-wt/2,gfG);   // back
  box(wt+.04,1,tl,M.ggTrim,wt/2,.5,tl/2,gfG);    // left
  box(wt+.04,1,tl,M.ggTrim,tw-wt/2,.5,tl/2,gfG); // right
}

// ─────────────────────────────────────────────────────────────────────────────
// BUILD FIRST FLOOR
// ─────────────────────────────────────────────────────────────────────────────
function buildFF(){
  const base=GFT, cx=D.cx, wt=D.wt, fH=D.ffH;
  const iw=D.iw, tl=D.tl, tw=D.tw;

  function fb(w,h,d,mat,x,y,z,grp=ffG){ return box(w,h,d,mat,x,base+y,z,grp); }
  function fc(rt,rb,h,mat,x,y,z,grp=ffG){ return cyl(rt,rb,h,mat,x,base+y,z,grp); }

  // Galaxy granite floor
  fb(iw,.1,tl-2*wt,M.ggFloor,cx,.05,tl/2);
  // Ceiling
  fb(iw,.04,tl-2*wt,M.ceil,cx,fH-.02,tl/2);

  // Outer walls
  // Front: two large windows flanking centre
  fb(tw,fH,wt,M.extWall,cx,fH/2,wt/2);  // solid then cut with windows
  addWindow(ffG,cx-4,base+5,wt/2,3,4,'x');
  addWindow(ffG,cx+4,base+5,wt/2,3,4,'x');
  fb(tw,fH,wt,M.extWall,cx,fH/2,tl-wt/2); // back
  fb(wt,fH,tl,M.extWall,wt/2,fH/2,tl/2);  // left
  fb(wt,fH,tl,M.extWall,tw-wt/2,fH/2,tl/2); // right
  addWindow(ffG,wt/2,base+4.5,16,3,3.5,'z');
  addWindow(ffG,wt/2,base+4.5,34,3,3.5,'z');
  addWindow(ffG,tw-wt/2,base+4.5,16,3,3.5,'z');
  addWindow(ffG,tw-wt/2,base+4.5,34,3,3.5,'z');

  // Internal: bedroom separator
  const bWZ=D.hallEndZ;
  fb(tw-6,fH,wt,M.intWall, cx+3,fH/2,bWZ);
  fb(3,fH-7,wt,M.intWall,  cx-6.5,fH/2-3.5+(fH-7)/2,bWZ);
  intDoor(ffG, cx-3, bWZ, base, 3, 7);

  // Toilet FF (same location)
  const toiletX1=tw-wt-5;
  fb(wt,fH,tl-wt-bWZ,M.intWall, toiletX1,fH/2,(bWZ+tl-wt)/2);
  intDoor(ffG, toiletX1+2.5, bWZ+.12, base, 2.5, 7);
  buildBath(ffG, toiletX1, tw-wt, bWZ+wt, tl-wt, base);

  // Landing railing at stair opening
  box(.08,3,4,M.metal, D.wt+1.8,base+1.5,D.staEndZ+2,ffG);
  box(4,.08,.08,M.wood, D.wt+2+1,base+3,D.staEndZ+2,ffG);

  // FF slab + parapet
  fb(tw,D.slabT,tl,M.slab, cx,fH+D.slabT/2,tl/2);
  fb(tw,D.para,wt,M.extWall, cx,fH+D.slabT+D.para/2,wt/2);       // front para
  fb(tw,D.para,wt,M.extWall, cx,fH+D.slabT+D.para/2,tl-wt/2);    // back para
  fb(wt,D.para,tl,M.extWall, wt/2,fH+D.slabT+D.para/2,tl/2);     // left para
  fb(wt,D.para,tl,M.extWall, tw-wt/2,fH+D.slabT+D.para/2,tl/2);  // right para

  // Parapet granite capping strip
  fb(tw,.15,wt+.06,M.ggTrim, cx,fH+D.slabT+D.para+.07,wt/2);
  fb(tw,.15,wt+.06,M.ggTrim, cx,fH+D.slabT+D.para+.07,tl-wt/2);
  fb(wt+.06,.15,tl,M.ggTrim, wt/2,fH+D.slabT+D.para+.07,tl/2);
  fb(wt+.06,.15,tl,M.ggTrim, tw-wt/2,fH+D.slabT+D.para+.07,tl/2);

  // Water tank
  fb(3,3.5,3,M.extWall, cx,fH+D.slabT+D.para+1.75,8);
  fb(3.1,.15,3.1,M.ggTrim, cx,fH+D.slabT+D.para+3.57,8);

  // Hall arch FF
  buildArch(ffG, cx, D.staEndZ, iw, 7.5, .28, base);

  // FF bedroom + hall furniture
  buildBed(furnG, wt, toiletX1, bWZ+wt, tl-wt, base, M.red);
  buildHallFurn(furnG, wt, tw-wt, D.staEndZ, bWZ, base);
}

// ─────────────────────────────────────────────────────────────────────────────
// EXTERIOR
// ─────────────────────────────────────────────────────────────────────────────
function buildExt(){
  const cx=D.cx, tl=D.tl, tw=D.tw;
  const totalH=GFT+D.ffH+D.slabT+D.para;

  // Ground/lawn
  box(80,.2,90,M.grass, cx,-.1,tl/2,extG);
  // Compound front wall
  box(56,3,.3,M.cpndWall, cx,1.5,-14,extG);
  // Gate pillars
  cyl(.75,.75,5.5,M.pillar, cx-3.5,2.75,-14,extG);
  cyl(.75,.75,5.5,M.pillar, cx+3.5,2.75,-14,extG);
  box(1.8,.4,1.8,M.ggTrim, cx-3.5,5.45,-14,extG);  // caps
  box(1.8,.4,1.8,M.ggTrim, cx+3.5,5.45,-14,extG);

  // Granite pathway to front door
  box(5,.22,14,M.path, cx,.11,-6.5,extG);
  // Driveway slab on right
  box(9,.18,16,M.path, cx+13,.09,8,extG);

  // Side walls
  box(.3,3,60,M.cpndWall, cx-12,1.5,14,extG);
  box(.3,3,60,M.cpndWall, cx+12,1.5,14,extG);

  // Decorative corner pillars on house
  cyl(.7,.7,totalH,M.pillar, 0,totalH/2,0,extG);
  cyl(.7,.7,totalH,M.pillar, tw,totalH/2,0,extG);
  cyl(.5,.5,totalH,M.pillar, 0,totalH/2,tl,extG);
  cyl(.5,.5,totalH,M.pillar, tw,totalH/2,tl,extG);
  // Cap pyramids on pillars
  [0,tw].forEach(px=>{
    const pg=new THREE.ConeGeometry(.8,.6,4);
    const pm=new THREE.Mesh(pg,M.ggTrim);
    pm.position.set(px,totalH+.3,0); extG.add(pm);
  });

  // Exterior wall lights (entry)
  box(.3,.3,.3,M.gold, 1.8,D.gfH-.5,.05,extG);
  box(.3,.3,.3,M.gold, tw-1.8,D.gfH-.5,.05,extG);
  const el1=new THREE.PointLight(0xffcc44,3,10);
  el1.position.set(1.8,D.gfH-.5,.6); extG.add(el1);
  const el2=new THREE.PointLight(0xffcc44,3,10);
  el2.position.set(tw-1.8,D.gfH-.5,.6); extG.add(el2);

  // Trees
  addTree(-8,-6); addTree(cx+12,-6);
  addTree(-8,50); addTree(cx+12,50);

  // GF cornice band (horizontal)
  box(tw+.1,.35,D.wt,M.ggTrim, cx,D.gfH+D.slabT+.17,.35,extG);
  box(tw+.1,.35,D.wt,M.ggTrim, cx,D.gfH+D.slabT+.17,tl-.35,extG);
  box(D.wt,.35,tl+.1,M.ggTrim, .35,D.gfH+D.slabT+.17,tl/2,extG);
  box(D.wt,.35,tl+.1,M.ggTrim, tw-.35,D.gfH+D.slabT+.17,tl/2,extG);
}

// ─────────────────────────────────────────────────────────────────────────────
// FRONT ELEVATION DETAILS
// ─────────────────────────────────────────────────────────────────────────────
function buildFrontElevation(){
  const cx=D.cx, tw=D.tw;
  // Sunshade / chajja over main door (lapotea slab)
  box(tw*.5,.2,.9,M.lap, cx,D.gfH*.62,.6,gfG);
  // Lintel band over windows GF
  box(2.6,.2,.12,M.ggTrim, 2.2,5.5+3.5/2+.1,D.wt/2+.04,gfG);
  box(2.6,.2,.12,M.ggTrim, tw-2.2,5.5+3.5/2+.1,D.wt/2+.04,gfG);
  // Sill below windows GF
  box(2.6,.2,.2,M.lap, 2.2,5.5-3.5/2-.1,D.wt/2+.04,gfG);
  box(2.6,.2,.2,M.lap, tw-2.2,5.5-3.5/2-.1,D.wt/2+.04,gfG);
  // Lintel FF windows
  const ffBase=GFT;
  box(3.4,.2,.12,M.ggTrim, cx-4,ffBase+5+4/2+.1,D.wt/2+.04,ffG);
  box(3.4,.2,.12,M.ggTrim, cx+4,ffBase+5+4/2+.1,D.wt/2+.04,ffG);
  box(3.4,.18,.2,M.lap, cx-4,ffBase+5-4/2-.08,D.wt/2+.04,ffG);
  box(3.4,.18,.2,M.lap, cx+4,ffBase+5-4/2-.08,D.wt/2+.04,ffG);
  // Decorative horizontal band on front wall at mid-height GF
  box(tw,.18,.1,M.ggTrim, cx,D.gfH*.5,D.wt/2+.05,gfG);
  // Decorative band FF
  box(tw,.18,.1,M.ggTrim, cx,GFT+D.ffH*.5,D.wt/2+.05,ffG);
  // House name plate above door
  box(2.4,.5,.1,M.ggTrim,cx,D.gfH*.75,D.wt/2+.05,gfG);
}

// ─────────────────────────────────────────────────────────────────────────────
// DINING AREA (GF, between kitchen & hall ~ z=14..20)
// ─────────────────────────────────────────────────────────────────────────────
function buildDining(grp,yBase=0){
  const cx=D.cx+1, cz=D.staEndZ+4; // dining zone centre
  // Table (6-seater, galaxy granite top)
  box(5.5,.12,3,M.ggTrim, cx,yBase+2.65,cz,grp);
  box(5.5,.08,3,M.wood,   cx,yBase+2.5, cz,grp);
  // Table legs
  [[-2.3,-1.2],[2.3,-1.2],[-2.3,1.2],[2.3,1.2]].forEach(([dx,dz])=>{
    cyl(.06,.06,2.5,M.metal,cx+dx,yBase+1.25,cz+dz,grp,8);
  });
  // Chairs (6)
  const chairPos=[[-3.6,0],[-1.2,-2.2],[1.2,-2.2],[-1.2,2.2],[1.2,2.2],[3.6,0]];
  chairPos.forEach(([dx,dz])=>{
    const facing = dz<-1 ? 0 : dz>1 ? Math.PI : dx<0 ? Math.PI/2 : -Math.PI/2;
    box(1.6,1.4,1.6,M.wood,cx+dx,yBase+.7,cz+dz,grp);
    box(1.6,1.8,.18,M.wood,cx+dx,yBase+1.8,cz+dz+(dz<-1?-.9:dz>1?.9:dx<0?-.9:.9),grp);
  });
  // Pendant light above table
  cyl(.04,.04,1.8,M.metal,cx,yBase+D.gfH-.9,cz,grp,8);
  cyl(.35,.25,.3,M.gold,  cx,yBase+D.gfH-2,cz,grp,16);
  const dl=new THREE.PointLight(0xffe8cc,3,8);
  dl.position.set(cx,yBase+D.gfH-2.2,cz); grp.add(dl); iLights.push(dl);
  // Decorative bowl on table
  cyl(.4,.5,.25,M.ggTrim,cx,yBase+2.78,cz,grp,16);
  sph(.3,M.red,cx,yBase+2.9,cz,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// HANGING CEILING LIGHTS
// ─────────────────────────────────────────────────────────────────────────────
function addPendant(x,y,z,grp=gfG){
  cyl(.03,.03,1.2,M.metal,x,y-.6,z,grp,8);
  cyl(.4,.3,.35,M.gold,x,y-1.35,z,grp,16);
  const pl=new THREE.PointLight(0xfff5cc,2.5,10);
  pl.position.set(x,y-1.6,z); grp.add(pl); iLights.push(pl);
}

// ─────────────────────────────────────────────────────────────────────────────
// CURTAINS (thin fabric panels on interior side of windows)
// ─────────────────────────────────────────────────────────────────────────────
// inDir: +1 = interior is in +x direction (left wall), -1 = interior is in -x direction (right wall)
function addCurtain(grp,cx,cy,cz,w,h,axis,col=0xf5e6d3,inDir=1){
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:.9,side:THREE.DoubleSide,transparent:true,opacity:.85});
  const off=.22*inDir;
  if(axis==='x'){
    box(w/2-.1,h,.08,mat,cx-w/4,cy,cz+Math.abs(off),grp);
    box(w/2-.1,h,.08,mat,cx+w/4,cy,cz+Math.abs(off),grp);
    box(w+.4,.06,.06,M.gold,cx,cy+h/2+.08,cz+Math.abs(off),grp);
  } else {
    box(.08,h,w/2-.1,mat,cx+off,cy,cz-w/4,grp);
    box(.08,h,w/2-.1,mat,cx+off,cy,cz+w/4,grp);
    box(.06,.06,w+.4,M.gold,cx+off,cy+h/2+.08,cz,grp);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// POTTED PLANTS (indoor)
// ─────────────────────────────────────────────────────────────────────────────
function addPlant(x,y,z,grp=gfG,scale=1){
  cyl(.18*scale,.22*scale,.4*scale,M.ggTrim,x,y+.2*scale,z,grp,10); // pot
  cyl(.08*scale,.1*scale,.3*scale,M.green,x,y+.55*scale,z,grp,8);   // stem
  sph(.35*scale,M.treeLeaf,x,y+.9*scale,z,grp);
  sph(.22*scale,M.treeLeaf,x+.2*scale,y+.8*scale,z-.1*scale,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// CAR (driveway)
// ─────────────────────────────────────────────────────────────────────────────
function addCar(x,z,grp=extG){
  const carMat=new THREE.MeshStandardMaterial({color:0x1a3a5c,roughness:.3,metalness:.6});
  const glassMat=new THREE.MeshStandardMaterial({color:0x88aacc,transparent:true,opacity:.5,roughness:.05});
  const tyreMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:.9});
  // Body
  box(7.5,1.5,3.2,carMat,x,.75,z,grp);
  // Cabin/roof
  box(4.5,1.2,3,carMat,x-.2,1.95,z,grp);
  // Windscreens
  box(4.5,.04,3,glassMat,x-.2,1.95,z,grp);
  // Side windows
  box(.06,1,2.8,glassMat,x+1.8,1.95,z,grp);
  box(.06,1,2.8,glassMat,x-2.2,1.95,z,grp);
  // Wheels (dx=fore-aft offset, dz=side offset)
  [[-2.8,-1.65],[-2.8,1.65],[2.8,-1.65],[2.8,1.65]].forEach(([dx,dz])=>{
    cyl(.55,.55,.35,M.metal,x+dx,.55,z+dz,grp,16);
    cyl(.38,.38,.38,tyreMat, x+dx,.55,z+dz,grp,16);
  });
  // Headlights
  const hlMat=new THREE.MeshStandardMaterial({color:0xffffdd,emissive:0xffff88,emissiveIntensity:.6});
  box(.08,.3,.5,hlMat,x+3.78,.9,z-1.1,grp);
  box(.08,.3,.5,hlMat,x+3.78,.9,z+1.1,grp);
  // Rear lights
  const rlMat=new THREE.MeshStandardMaterial({color:0xff2222,emissive:0xff0000,emissiveIntensity:.4});
  box(.08,.25,.45,rlMat,x-3.78,.9,z-1.1,grp);
  box(.08,.25,.45,rlMat,x-3.78,.9,z+1.1,grp);
}

// ─────────────────────────────────────────────────────────────────────────────
// TERRACE FEATURES (on FF slab)
// ─────────────────────────────────────────────────────────────────────────────
function buildTerrace(){
  const base=GFT+D.ffH+D.slabT;
  const cx=D.cx, tl=D.tl, tw=D.tw, wt=D.wt;
  const terrMat=new THREE.MeshStandardMaterial({color:0xc8c0b8,roughness:.5});
  // Terrace floor (polished concrete)
  box(tw-2*wt,.08,tl-2*wt,terrMat, cx,base+.04,tl/2,ffG);
  // Terrace chairs (seating zone at back)
  [[4,tl-10],[4,tl-14],[tw-4,tl-10],[tw-4,tl-14]].forEach(([x,z])=>{
    box(1.5,1.2,1.5,M.red, x,base+.6,z,ffG);
    box(1.5,1.8,.2,M.red,  x,base+1.5,z+.85,ffG);
  });
  // Small terrace table
  box(2.5,.12,2.5,M.ggTrim, cx,base+1.6,tl-12,ffG);
  cyl(.06,.06,1.6,M.metal,  cx,base+.8, tl-12,ffG,8);
  // Garden pots on parapet corners
  [[2,wt+.4],[tw-2,wt+.4],[2,tl-wt-.4],[tw-2,tl-wt-.4]].forEach(([x,z])=>{
    cyl(.3,.35,.4,M.ggTrim, x,base+D.para+.2,z,ffG,12);
    sph(.35,M.treeLeaf,     x,base+D.para+.65,z,ffG);
  });
  // Clothesline poles + wire
  cyl(.06,.06,3,M.metal, 3,      base+D.para+1.5,tl-5,ffG,8);
  cyl(.06,.06,3,M.metal, tw-3,   base+D.para+1.5,tl-5,ffG,8);
  box(.04,.04,tw-6,M.metal, cx,  base+D.para+3,  tl-5,ffG);
  // Solar panels (decorative slabs angled on roof)
  box(4,.06,3,new THREE.MeshStandardMaterial({color:0x1a2a4a,metalness:.4,roughness:.2}),
      cx,base+D.para+.3,tl-8,ffG,0.25,0,0);
}

// ─────────────────────────────────────────────────────────────────────────────
// ASSEMBLE
// ─────────────────────────────────────────────────────────────────────────────
buildGF();
buildFF();
buildExt();
buildFrontElevation();

// --- Extra details added after base build ---

// Dining table (GF hall zone)
buildDining(furnG);

// Pendant lights – hall (GF & FF)
addPendant(D.cx,D.gfH,22,gfG);
addPendant(D.cx-3,D.gfH,17,gfG);
addPendant(D.cx+3,D.gfH,17,gfG);
addPendant(D.cx,GFT+D.ffH,22,ffG);

// Curtains – GF side windows (left wall inDir=+1, right wall inDir=-1)
addCurtain(gfG, D.wt/2,      4.8, 22, 2.5, 3.5,'z',0xf5e6d3, 1);
addCurtain(gfG, D.wt/2,      4.8, 36, 2.5, 3.5,'z',0xe8d5c0, 1);
addCurtain(gfG, D.tw-D.wt/2, 4.8, 22, 2.5, 3.5,'z',0xf0ddc8,-1);
addCurtain(gfG, D.tw-D.wt/2, 4.8, 36, 2.5, 3.5,'z',0xf5e6d3,-1);

// Indoor plants – corners of hall & bedroom
addPlant(D.wt+.6, 0, D.staEndZ+.8, furnG, 1.1);
addPlant(D.tw-D.wt-.8, 0, D.staEndZ+.8, furnG, 1.0);
addPlant(D.wt+.6, 0, D.hallEndZ-.8, furnG, 1.2);

// Car in driveway
addCar(D.cx+13, 8, extG);

// Terrace furniture & features
buildTerrace();

// ─────────────────────────────────────────────────────────────────────────────
// VIEW PRESETS
// ─────────────────────────────────────────────────────────────────────────────
const views={
  ext:  {pos:[38,26,50],  tgt:[7.75,8,22]},
  elev: {pos:[7.75,12,-18],tgt:[7.75,8,0]},
  gf:   {pos:[7.75,8,16], tgt:[7.75,5,32]},
  ff:   {pos:[7.75,GFT+8,16],tgt:[7.75,GFT+5,32]},
  cut:  {pos:[-12,15,30], tgt:[7.75,8,22]},
  top:  {pos:[7.75,55,22],tgt:[7.75,0,22]},
};

function setView(k){
  const v=views[k]; if(!v) return;
  camera.position.set(...v.pos);
  controls.target.set(...v.tgt);
  controls.update();
  document.querySelectorAll('#ui .btn').forEach(b=>b.classList.remove('on'));
  event && event.target && event.target.classList && event.target.classList.add('on');
}

function showFloors(f){
  gfG.visible = f!=='ff';
  ffG.visible = f!=='gf';
}

const states={furn:true,light:true,ext_el:true};
function toggle(k){
  states[k]=!states[k];
  const btn=document.getElementById('btn'+k[0].toUpperCase()+k.slice(1));
  if(btn) btn.classList.toggle('on',states[k]);
  if(k==='furn') furnG.visible=states[k];
  if(k==='light') iLights.forEach(l=>l.visible=states[k]);
  if(k==='ext_el') extG.visible=states[k];
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER LOOP
// ─────────────────────────────────────────────────────────────────────────────
(function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
})();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
